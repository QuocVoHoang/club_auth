apiVersion: apps/v1
kind: Deployment
metadata:
  name: football-auth
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: football-auth
  template:
    metadata:
      labels:
        app: football-auth
    spec:
      containers:
        - name: football-auth
          image: ghcr.io/quocvohoang/football_auth:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ENV
              value: development
            - name: APP_NAME
              value: football-auth
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: debug
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
